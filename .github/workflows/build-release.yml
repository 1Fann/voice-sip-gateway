name: Build, verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build from public source and run gateway tests
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
          python3 tools/prepare_native.py
          bash gradlew :app:assembleRelease test --no-configuration-cache --console=plain
          python3 tools/audit_public.py
          python3 tools/verify_release.py

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish signed APK and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/audit_public.py
          python3 tools/verify_release.py
          python3 tools/make_source_zip.py
          tag=$(python3 -c 'import json,pathlib; p=next(pathlib.Path(".work/release").glob("*.apk")); m=next(json.loads(f.read_text()) for f in pathlib.Path("releases").glob("*/manifest.json") if json.loads(f.read_text())["name"]==p.name); print("v"+m["version"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; published assets are retained.'
            exit 0
          fi
          gh release create "$tag" .work/release/*.apk .work/release/*-source.zip .work/release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$GH_REPO $tag" --notes-file "releases/$tag/NOTES.md"
